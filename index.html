<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CoverIS BLE Wi-Fi Setup</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    input, button { padding: 10px; margin: 8px 0; width: 100%; font-size: 16px; }
    h2 { text-align: center; }
  </style>
</head>
<body>
  <h2>CoverIS BLE Wi-Fi Setup</h2>
  <input id="ssid" placeholder="Enter Wi-Fi SSID">
  <input id="password" type="password" placeholder="Enter Wi-Fi Password">
  <button onclick="connectAndSend()">Connect & Send to ESP32</button>
  <p id="status">Status: Waiting for user action...</p>

  <script>
    let serviceUUID = '12345678-1234-1234-1234-1234567890ab';  // Замените на ваш UUID, если нужно
    let characteristicUUID = 'abcd1234-abcd-1234-abcd-12345678abcd';  // Замените на ваш UUID, если нужно

    async function connectAndSend() {
      const ssid = document.getElementById('ssid').value;
      const password = document.getElementById('password').value;
      const fullText = ssid + '|' + password;
      const encoder = new TextEncoder();

      try {
        document.getElementById('status').innerText = 'Status: Scanning for devices...';

        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'CoverIS-BLE' }],
          optionalServices: [serviceUUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(serviceUUID);
        const characteristic = await service.getCharacteristic(characteristicUUID);

        await characteristic.writeValue(encoder.encode(fullText));

        document.getElementById('status').innerText = 'Status: Sent "' + fullText + '" to ESP32!';
      } catch (error) {
        document.getElementById('status').innerText = 'Error: ' + error;
      }
    }
  </script>
</body>
</html>
